# Production deployment to S3 + CloudFront (widget.samatrica.com).
# Manually triggered only; nothing deploys on push. Authentication is OIDC
# via the IAM role below: no AWS keys are stored in this repository.
# The widget runs on customers' websites, so this repo has its own
# isolated deploy role.
#
# TODO(backend): replace the three placeholders once the AWS side exists.
name: Deploy

on:
  workflow_dispatch:

# One deploy at a time; a second trigger waits instead of racing the first.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  # OIDC token for configure-aws-credentials.
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  S3_BUCKET: TODO-bucket-from-backend
  CLOUDFRONT_DISTRIBUTION_ID: TODO-distribution-id-from-backend
  DEPLOY_ROLE_ARN: TODO-role-arn-from-backend

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsc (type check), then vite build: one self-contained dist/widget.js.
      - name: Type-check and build
        run: npm run build

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: aws s3 sync dist/ "s3://$S3_BUCKET" --delete

      # widget.js keeps a stable, non-hashed name: the invalidation is what
      # makes a new version reach embedded sites despite long caching.
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
